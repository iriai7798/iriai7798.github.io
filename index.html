<h1>Hub</h1>
<p>Hub는 가족이 함께 쓰는 개인용 일정·할 일·메모 관리 웹 앱입니다. 각자의 데이터는 서로 분리되어 저장되며, 원하는 경우 본인의 Google 캘린더와 일정을 동기화할 수 있습니다.</p>
<h2>주요 기능</h2>
<ul><li>일정(달력·타임테이블), 할 일(스티커 보드), 메모(항목별 체크리스트)</li><li>Google 캘린더와 일정 양방향 동기화 (선택 사항)</li><li>가족 구성원별 데이터 분리</li></ul>
<p>이 앱은 가족 구성원만 사용하는 비공개 개인용 앱입니다.</p>
